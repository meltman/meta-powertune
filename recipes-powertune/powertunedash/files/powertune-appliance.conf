# Appliance-owned CAN / K-Pro integration settings, read by
# powertune-can.service and powertune-kpro-bridge.service.
# Plain KEY=VALUE only (systemd EnvironmentFile). Changes take effect on the
# next restart of the services.
#
# Empirically the populated Device 0 P8 CAN interface; not a general default
# for other hardware.
PT_CAN_INTERFACE=canE
# Casey's configured Hondata K-Pro rate (bit/s).
PT_CAN_BITRATE=1000000
PT_CAN_RESTART_MS=100
PT_KPRO_PROFILE=hondata-motec
